<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <title>FLR Points </title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        app: '#09090b',
                        card: '#18181b',
                        bordercolor: '#27272a',
                        blood: '#dc2626',
                        bloodbg: '#450a0a'
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #09090b; color: #e4e4e7; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .click-anim:active { transform: scale(0.98); }
    </style>
</head>
<body class="antialiased min-h-screen flex justify-center pb-24">

    <main class="w-full max-w-md p-4 flex flex-col gap-5">
        
        <!-- BILANS -->
        <section class="bg-card border border-bordercolor rounded-2xl p-6 text-center relative overflow-hidden flex flex-col items-center mt-1 shadow-xl">
            <div class="absolute top-3 right-3 flex items-center gap-1.5">
                <span id="sync-status" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" title="Łączenie z Firebase..."></span>
                <span class="text-[9px] text-zinc-500 uppercase tracking-widest font-bold">Live Firebase</span>
            </div>
            <h1 class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-1">Twoje pkt</h1>
            <div id="balance-display" class="text-6xl font-black tracking-tighter transition-all duration-300">0</div>
        </section>

        <!-- BANER REDUKCJI -->
        <div id="reduction-banner" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-500">Aktywna redukcja zarobku</span>
                <span id="reduction-info-text" class="text-xs text-zinc-300"></span>
            </div>
            <button onclick="cancelReduction()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">Cofnij</button>
        </div>

        <!-- OPCJE -->
        <section class="bg-card border border-bordercolor rounded-2xl p-3 flex flex-col gap-2">
            <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 px-1">Opcje Dodatkowe</span>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="openCustomModal('add')" class="bg-zinc-800/60 hover:bg-zinc-700 border border-zinc-700 p-2.5 rounded-xl text-xs font-semibold text-zinc-200 click-anim">+ Dodaj pkt</button>
                <button onclick="openCustomModal('sub')" class="bg-zinc-800/60 hover:bg-zinc-700 border border-zinc-700 p-2.5 rounded-xl text-xs font-semibold text-zinc-200 click-anim">- Odejmij pkt</button>
                <button onclick="openReduceModal()" class="bg-zinc-800/60 hover:bg-zinc-700 border border-zinc-700 p-2.5 rounded-xl text-xs font-semibold text-zinc-200 click-anim">Zredukuj zarobek %</button>
                <button onclick="resetRegistry()" class="bg-blood/10 hover:bg-blood/20 border border-blood/30 p-2.5 rounded-xl text-xs font-bold text-blood click-anim">Wyzeruj pkt</button>
            </div>
        </section>

        <!-- KALENDARZ -->
        <section class="bg-card border border-bordercolor rounded-2xl p-4">
            <div class="flex justify-between items-center mb-3">
                <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-300 hover:bg-zinc-700">&larr;</button>
                <span id="calendar-month-year" class="text-xs font-bold uppercase tracking-wider text-zinc-200"></span>
                <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-300 hover:bg-zinc-700">&rarr;</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center mb-2">
                <span class="text-[10px] font-bold text-zinc-500">Pn</span>
                <span class="text-[10px] font-bold text-zinc-500">Wt</span>
                <span class="text-[10px] font-bold text-zinc-500">Śr</span>
                <span class="text-[10px] font-bold text-zinc-500">Cz</span>
                <span class="text-[10px] font-bold text-zinc-500">Pt</span>
                <span class="text-[10px] font-bold text-zinc-500">So</span>
                <span class="text-[10px] font-bold text-zinc-500">Nd</span>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
            <div class="mt-3 text-center">
                <span class="text-[11px] text-zinc-400">Wybrany dzień: <strong id="active-date-text" class="text-white"></strong></span>
            </div>
        </section>

        <!-- KATALOG ZADAŃ -->
        <section>
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 class="text-[10px] font-bold uppercase tracking-wider text-zinc-500">Katalog Zdarzeń</h2>
                <button onclick="cycleSortMode()" id="sort-mode-btn" class="text-[10px] font-bold text-zinc-400 hover:text-zinc-200 bg-card border border-bordercolor px-2.5 py-1 rounded-lg transition-all">Sortowanie: Domyślne</button>
            </div>
            <div class="flex gap-1 mb-3 bg-card p-1 rounded-xl border border-bordercolor">
                <button onclick="switchTab(0)" id="tab-0" class="flex-1 text-xs font-bold py-2 rounded-lg transition-all bg-zinc-700 text-white shadow">Zarobek</button>
                <button onclick="switchTab(1)" id="tab-1" class="flex-1 text-xs font-bold py-2 rounded-lg transition-all text-zinc-400">Kary</button>
                <button onclick="switchTab(2)" id="tab-2" class="flex-1 text-xs font-bold py-2 rounded-lg transition-all text-zinc-400">Wykup</button>
            </div>
            <div id="action-list" class="flex flex-col gap-2"></div>
        </section>

        <!-- HISTORIA -->
        <section class="mt-1">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-[10px] font-bold uppercase tracking-wider text-zinc-500">Historia z wybranego dnia</h2>
                <span id="history-date-label" class="text-[10px] text-zinc-400 font-bold"></span>
            </div>
            <div id="history-list" class="flex flex-col gap-2"></div>
        </section>

    </main>

    <!-- MODALE -->
    <div id="custom-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-card border border-bordercolor rounded-2xl p-5 w-full max-w-xs flex flex-col gap-4">
            <h3 id="modal-title" class="text-sm font-bold text-zinc-200">Wprowadź punkty</h3>
            <input type="text" id="modal-name" placeholder="Nazwa zdarzenia..." class="w-full bg-app border border-bordercolor rounded-xl p-3 text-sm text-zinc-200 focus:outline-none focus:border-zinc-500">
            <input type="number" id="modal-points" placeholder="Liczba punktów..." class="w-full bg-app border border-bordercolor rounded-xl p-3 text-sm text-zinc-200 focus:outline-none focus:border-zinc-500">
            <div class="flex gap-2 mt-1">
                <button onclick="closeCustomModal()" class="flex-1 bg-zinc-800 py-2.5 rounded-xl text-xs font-semibold text-zinc-300">Anuluj</button>
                <button onclick="submitCustomModal()" class="flex-1 bg-zinc-100 text-zinc-950 py-2.5 rounded-xl text-xs font-bold">Zatwierdź</button>
            </div>
        </div>
    </div>

    <div id="reduce-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-card border border-bordercolor rounded-2xl p-5 w-full max-w-xs flex flex-col gap-4">
            <h3 class="text-sm font-bold text-zinc-200">Redukcja punktów</h3>
            <input type="number" id="reduce-percent" placeholder="Obniżka w %" class="w-full bg-app border border-bordercolor rounded-xl p-3 text-sm text-zinc-200 focus:outline-none">
            <input type="date" id="reduce-date" class="w-full bg-app border border-bordercolor rounded-xl p-3 text-sm text-zinc-200 focus:outline-none">
            <div class="flex gap-2 mt-1">
                <button onclick="closeReduceModal()" class="flex-1 bg-zinc-800 py-2.5 rounded-xl text-xs font-semibold text-zinc-300">Anuluj</button>
                <button onclick="submitReduce()" class="flex-1 bg-zinc-100 text-zinc-950 py-2.5 rounded-xl text-xs font-bold">Zastosuj</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-200 text-zinc-950 px-5 py-2 rounded-full font-bold text-xs opacity-0 pointer-events-none transition-opacity duration-300 shadow-2xl z-50 transform whitespace-nowrap">Zaktualizowano!</div>

    <!-- SKRYPTY FIREBASE ORAZ LOGIKI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCXkEhwVp9EkSEuQq1nwkiuNkXTRJk8-n0",
          authDomain: "rejestflr.firebaseapp.com",
          projectId: "rejestflr",
          storageBucket: "rejestflr.firebasestorage.app",
          messagingSenderId: "1017001684786",
          appId: "1:1017001684786:web:1a440900555ed8340bf12b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const originalDictionary = [
            {
                group: "Zarobek (+)", type: "positive",
                items: [
                    { name: "Masaż stóp", points: 10 }, { name: "Masaż pleców", points: 10 },
                    { name: "Obiad", points: 15 }, { name: "Sprzątanie domu", points: 20 },
                    { name: "Wywieszenie prania", points: 5 }, { name: "Złożenie prania", points: 5 },
                    { name: "Prasowanie", points: 10 }, { name: "Mycie naczyń", points: 5 },
                    { name: "Pieszczenie cipki", points: 15 }, { name: "Dzień w pasie cnoty", points: 50 },
                    { name: "Zlizanie nasienia", points: 150 }, { name: "Zadanie nago", points: 20 },
                    { name: "Zadanie w bieliźnie", points: 30 }
                ]
            },
            {
                group: "Kary (-)", type: "negative",
                items: [
                    { name: "Marudzenie", points: -50 }, { name: "Złe zachowanie", points: -30 },
                    { name: "Pyskowanie", points: -100 }, { name: "Dojście bez pozwolenia", points: -200 },
                    { name: "Brak orgazmu Żonie", points: -50 }
                ]
            },
            {
                group: "Wykup (-)", type: "negative",
                items: [
                    { name: "Orgazm w gumce", points: -150 }, { name: "Orgazm na stopy", points: -100 },
                    { name: "Orgazm na dłoń", points: -50 }, { name: "Orgazm zrujnowany", points: -200 },
                    { name: "Lodzik", points: -300 }, { name: "Masturbacja nago", points: -500 },
                    { name: "Całowanie stóp", points: -20 }, { name: "Całowanie tyłka", points: -30 }
                ]
            }
        ];

        let eventDictionary = JSON.parse(JSON.stringify(originalDictionary));
        let balance = 0;
        let historyEntries = [];
        let activeDate = new Date().toISOString().split('T')[0];
        let currentTab = 0;
        let currentModalType = 'add';
        let activeReduction = null;
        let sortMode = 0;
        let calendarYear = new Date().getFullYear();
        let calendarMonth = new Date().getMonth();
        let isInitialLoad = true;

        // Rejestracja Service Workera
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker zarejestrowany pomyślnie!'))
                    .catch((err) => console.log('Błąd rejestracji Service Workera:', err));
            });
        }

        const dbRef = ref(db, 'flr_registry');
        onValue(dbRef, (snapshot) => {
            const statusEl = document.getElementById('sync-status');
            const data = snapshot.val();
            if (data) {
                balance = data.balance || 0;
                historyEntries = data.history || [];
                activeReduction = data.activeReduction || null;
                if (data.dictionary) eventDictionary = data.dictionary;
            } else {
                saveToFirebase();
            }
            renderActions();
            renderCalendar();
            updateUI();
            statusEl.className = "w-2 h-2 rounded-full bg-emerald-500";
            if (!isInitialLoad) showToast("Zsynchronizowano!");
            isInitialLoad = false;
        });

        function saveToFirebase() {
            set(ref(db, 'flr_registry'), {
                balance,
                history: historyEntries,
                activeReduction,
                dictionary: eventDictionary
            }).catch(() => {
                document.getElementById('sync-status').className = "w-2 h-2 rounded-full bg-red-500";
            });
        }

        window.changeMonth = function(direction) {
            calendarMonth += direction;
            if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
            else if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const label = document.getElementById('calendar-month-year');
            const activeText = document.getElementById('active-date-text');
            grid.innerHTML = '';

            const monthsNames = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
            label.innerText = `${monthsNames[calendarMonth]} ${calendarYear}`;
            activeText.innerText = formatDateText(activeDate);

            const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
            const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            const totalDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();

            for (let i = 0; i < adjustedFirstDay; i++) grid.appendChild(document.createElement('div'));

            for (let day = 1; day <= totalDays; day++) {
                const monthStr = String(calendarMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateStr = `${calendarYear}-${monthStr}-${dayStr}`;

                const isSelected = dateStr === activeDate;
                const isToday = dateStr === new Date().toISOString().split('T')[0];

                const btn = document.createElement('button');
                btn.className = `h-8 rounded-lg text-xs font-bold transition-all flex items-center justify-center click-anim ${
                    isSelected ? 'bg-zinc-100 text-zinc-950 shadow' : isToday ? 'border border-zinc-500 text-zinc-200' : 'text-zinc-400 hover:bg-zinc-800'
                }`;
                btn.innerText = day;
                btn.onclick = () => { activeDate = dateStr; renderCalendar(); updateUI(); };
                grid.appendChild(btn);
            }
        }

        function formatDateText(dateStr) {
            const parts = dateStr.split('-');
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }

        window.switchTab = function(index) {
            currentTab = index;
            [0, 1, 2].forEach(i => {
                const tab = document.getElementById(`tab-${i}`);
                if (i === index) { tab.classList.add('bg-zinc-700', 'text-white', 'shadow'); tab.classList.remove('text-zinc-400'); }
                else { tab.classList.remove('bg-zinc-700', 'text-white', 'shadow'); tab.classList.add('text-zinc-400'); }
            });
            renderActions();
        }

        window.cycleSortMode = function() {
            sortMode = (sortMode + 1) % 3;
            const btn = document.getElementById('sort-mode-btn');
            if (sortMode === 0) btn.innerText = "Sortowanie: Domyślne";
            else if (sortMode === 1) btn.innerText = "Sortowanie: Rosnąco";
            else if (sortMode === 2) btn.innerText = "Sortowanie: Malejąco";
            renderActions();
        }

        function renderActions() {
            const listContainer = document.getElementById('action-list');
            listContainer.innerHTML = '';
            const group = eventDictionary[currentTab];
            const isNegative = group.type === 'negative';
            let actionLabel = currentTab === 0 ? "+ Dodaj" : (currentTab === 1 ? "- zabierz" : "- kup");

            let itemsToRender = group.items.map((item, idx) => ({ ...item, originalIndex: idx }));
            if (sortMode === 1) itemsToRender.sort((a, b) => a.points - b.points);
            else if (sortMode === 2) itemsToRender.sort((a, b) => b.points - a.points);

            itemsToRender.forEach((item) => {
                const row = document.createElement('div');
                let affordabilityClass = isNegative ? 'bg-bloodbg/15 border-blood/20 text-zinc-200' : 'bg-card border-bordercolor text-zinc-200';
                if (currentTab === 2 && item.points < 0 && balance >= Math.abs(item.points)) {
                    affordabilityClass = 'bg-emerald-950/30 border-emerald-500/50 text-zinc-200';
                }
                row.className = `flex items-center justify-between p-3 rounded-xl border transition-all relative ${affordabilityClass}`;
                row.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 cursor-pointer pr-2" onclick="window.tryExecuteEvent('${item.name}', ${item.points})">
                        <span class="${item.points > 0 ? 'text-zinc-100' : 'text-red-400'} font-black text-xs min-w-[36px]">${item.points > 0 ? '+' : ''}${item.points}</span>
                        <span class="text-xs font-medium text-zinc-200">${item.name}</span>
                    </div>
                    <button onclick="window.tryExecuteEvent('${item.name}', ${item.points})" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 px-2.5 py-1 rounded-lg text-zinc-300 font-medium click-anim">${actionLabel}</button>
                `;
                listContainer.appendChild(row);
            });
        }

        window.tryExecuteEvent = function(name, points) {
            if (points < 0 && balance < Math.abs(points)) {
                alert(`Brak punktów! Masz ${balance}, a potrzeba ${Math.abs(points)}.`);
                return;
            }
            const entry = { id: Date.now().toString(), name, points, date: activeDate };
            balance += points;
            historyEntries.unshift(entry);
            saveToFirebase();
        }

        window.resetRegistry = function() {
            if (confirm("Wyzerować wszystko?")) {
                balance = 0; historyEntries = []; saveToFirebase();
            }
        }

        window.deleteEntry = function(id) {
            const index = historyEntries.findIndex(e => e.id === id);
            if (index !== -1) {
                balance -= historyEntries[index].points;
                historyEntries.splice(index, 1);
                saveToFirebase();
            }
        }

        function updateUI() {
            document.getElementById('balance-display').innerText = balance;
            document.getElementById('history-date-label').innerText = formatDateText(activeDate);
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';

            const dayEntries = historyEntries.filter(e => e.date === activeDate);
            if (dayEntries.length === 0) {
                historyList.innerHTML = '<div class="text-zinc-600 text-xs italic py-2 px-1">Brak wpisów.</div>';
                return;
            }

            dayEntries.forEach(entry => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-card border border-bordercolor px-3 py-2.5 rounded-xl";
                item.innerHTML = `
                    <span class="text-xs font-medium text-zinc-200">${entry.name}</span>
                    <div class="flex items-center gap-3">
                        <span class="font-black text-sm ${entry.points < 0 ? 'text-red-400' : 'text-zinc-100'}">${entry.points > 0 ? '+' : ''}${entry.points}</span>
                        <button onclick="window.deleteEntry('${entry.id}')" class="text-zinc-600 hover:text-red-500 text-xs">✕</button>
                    </div>`;
                historyList.appendChild(item);
            });
        }

        window.openCustomModal = function(type) { currentModalType = type; document.getElementById('custom-modal').classList.remove('hidden'); document.getElementById('custom-modal').classList.add('flex'); }
        window.closeCustomModal = function() { document.getElementById('custom-modal').classList.remove('hidden'); document.getElementById('custom-modal').classList.add('hidden'); }
        window.submitCustomModal = function() {
            const name = document.getElementById('modal-name').value.trim();
            let points = parseInt(document.getElementById('modal-points').value, 10);
            if (!name || isNaN(points)) return;
            if (currentModalType === 'sub') points = -Math.abs(points);
            tryExecuteEvent(name, points);
            closeCustomModal();
        }
        window.openReduceModal = function() { document.getElementById('reduce-modal').classList.remove('hidden'); document.getElementById('reduce-modal').classList.add('flex'); }
        window.closeReduceModal = function() { document.getElementById('reduce-modal').classList.add('hidden'); }
        window.submitReduce = function() {
            const percent = parseFloat(document.getElementById('reduce-percent').value);
            const endDate = document.getElementById('reduce-date').value;
            if (isNaN(percent) || !endDate) return;
            activeReduction = { percent, endDate };
            saveToFirebase();
            closeReduceModal();
        }
        window.cancelReduction = function() { activeReduction = null; saveToFirebase(); }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text; toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 1500);
        }
    </script>
</body>
</html>
